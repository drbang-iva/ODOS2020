# ODOS — Medplum FHIR foundation (dev)
# Runs locally on laptop. Same file deploys to Iris unchanged.
#
# Start:   docker compose up -d
# Logs:    docker compose logs -f medplum-server
# Stop:    docker compose down
# Reset:   docker compose down -v    (nukes Postgres volume — fresh start)
#
# First-run: npm run setup-practice (interactive, human-supervised)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: medplum
      POSTGRES_USER: medplum
      POSTGRES_PASSWORD: medplum
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medplum -d medplum"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - odos-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "medplum"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "medplum", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - odos-internal

  medplum-binary-init:
    image: alpine:3.21
    user: "0:0"
    command: ["chown", "-R", "1000:1000", "/data/binary"]
    volumes:
      - medplum-binary:/data/binary
    restart: "no"

  # Upgrade server + app together only after the scoped-clinician live RBAC gates pass.
  medplum-server:
    image: medplum/medplum-server:5.1.8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      medplum-binary-init:
        condition: service_completed_successfully
    env_file:
      - .env
      - .odos/medplum-signing.env
    environment:
      MEDPLUM_DEFAULT_SUPER_ADMIN_EMAIL: ${MEDPLUM_ADMIN_EMAIL}
      MEDPLUM_DEFAULT_SUPER_ADMIN_PASSWORD: ${MEDPLUM_ADMIN_PASSWORD}
      MEDPLUM_STORAGE_BASE_URL: ${MEDPLUM_STORAGE_BASE_URL:-http://localhost:8103/storage/}
    volumes:
      - ./medplum.config.json:/config/medplum.config.json:ro
      - medplum-binary:/data/binary
      - ./backup:/backup
    ports:
      - "8103:8103"
    command: ["file:/config/medplum.config.json,env"]
    networks:
      - odos-internal

  medplum-app:
    image: medplum/medplum-app:5.1.8
    restart: unless-stopped
    depends_on:
      - medplum-server
    ports:
      - "8100:3000"
    environment:
      MEDPLUM_BASE_URL: http://localhost:8103/
    networks:
      - odos-internal

  weasyprint:
    image: odos-weasyprint:69.0
    build:
      context: .
      dockerfile: docker/weasyprint.Dockerfile
    profiles: ["agentops"]
    restart: unless-stopped
    working_dir: /workspace
    command: ["node", "mcp/dist/mcp/src/correspondence/render-server.js"]
    volumes:
      - ./:/workspace:ro
    ports:
      - "127.0.0.1:8788:8788"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - odos-internal

  odos-core-deps:
    image: node:22-alpine
    profiles: ["agentops"]
    working_dir: /workspace/mcp
    command: ["npm", "ci", "--omit=dev", "--include=optional", "--no-audit", "--no-fund"]
    volumes:
      - ./:/workspace:ro
      - odos-mcp-node-modules:/workspace/mcp/node_modules
    restart: "no"

  odos-core:
    image: node:22-alpine
    profiles: ["agentops"]
    working_dir: /workspace
    command: ["npm", "--prefix", "mcp", "run", "start"]
    environment:
      MEDPLUM_BASE_URL: http://medplum-server:8103/
      ODOS_POSTGRES_URL: postgresql://medplum:medplum@postgres:5432/medplum
      ODOS_AGENTOPS_RUNTIME: supervisor
      ODOS_WEASYPRINT_URL: http://weasyprint:8788
      NODE_OPTIONS: --experimental-network-imports=false
    volumes:
      - ./:/workspace:ro
      - odos-mcp-node-modules:/workspace/mcp/node_modules:ro
    depends_on:
      medplum-server:
        condition: service_started
      weasyprint:
        condition: service_healthy
      odos-core-deps:
        condition: service_completed_successfully
    networks:
      - odos-internal
      - odos-egress

  odos-agent-iris:
    image: node:22-alpine
    profiles: ["agentops"]
    working_dir: /workspace
    command: ["node", "mcp/dist/agentops/runtime/agent-process.js"]
    environment:
      AGENT_DEVICE_ID: https://odos2020.com/agents/iris
      MEDPLUM_BASE_URL: http://medplum-server:8103/
      ODOS_CORE_IPC_URL: http://odos-core:8787/
    volumes:
      - ./:/workspace:ro
    depends_on:
      - odos-core
    networks:
      - odos-internal

volumes:
  postgres-data:
  medplum-binary:
  odos-mcp-node-modules:

networks:
  odos-internal:
    driver: bridge
  odos-egress:
