# ODOS isolated destructive DR drill stack.
# Project name must be supplied as: docker-compose -p odos-dr-drill -f docker-compose.dr-drill.yml ...

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: medplum
      POSTGRES_USER: medplum
      POSTGRES_PASSWORD: medplum
    volumes:
      - odos_dr_drill_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medplum -d medplum"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "medplum"]
    volumes:
      - odos_dr_drill_redis:/data
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "medplum", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  medplum-binary-init:
    image: alpine:3.21
    user: "0:0"
    command: ["chown", "-R", "1000:1000", "/data/binary"]
    volumes:
      - odos_dr_drill_binary:/data/binary
    restart: "no"

  medplum-server:
    image: medplum/medplum-server:5.1.8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      medplum-binary-init:
        condition: service_completed_successfully
    env_file:
      - .odos/medplum-dr-drill-signing.env
    volumes:
      - ./medplum.dr-drill.config.json:/config/medplum.config.json:ro
      - odos_dr_drill_binary:/data/binary
      - ./backup-dr-drill:/backup
    ports:
      - "18103:8103"
    command: ["file:/config/medplum.config.json,env"]

  medplum-app:
    image: medplum/medplum-app:5.1.8
    restart: unless-stopped
    depends_on:
      - medplum-server
    ports:
      - "18100:3000"
    environment:
      MEDPLUM_BASE_URL: http://localhost:18103/

volumes:
  odos_dr_drill_postgres:
    name: odos_dr_drill_postgres
  odos_dr_drill_redis:
    name: odos_dr_drill_redis
  odos_dr_drill_binary:
    name: odos_dr_drill_binary
