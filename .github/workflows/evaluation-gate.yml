name: evaluation-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]

concurrency:
  group: evaluation-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

# Every PR into main needs a Fable, Opus, or Codex model review before it merges.
# Author != evaluator remains a procedural expectation in coding kickoffs;
# review bots are a first pass, not a substitute for model review.
#
# The workflow runs from the protected default branch and publishes the required
# check-evaluation check run onto the current PR head. It never checks out or
# executes code from the PR branch.
#
# The newest marker comment, posted from any account, governs the gate.
# Passes with either:
#   - a trusted passing evaluation bound to the current head:
#       Evaluated-by: Fable 5 — PASS
#       Head-SHA: <40-character current PR head SHA>
#   - label "evaluated" AND all override evidence in that same newest comment:
#       Evaluated-by: <authorizing operator name> — OVERRIDE
#       Head-SHA: <40-character current PR head SHA>
#       Override-Reason: <nonempty reason for the authorized bypass>
# The label alone does not pass. The Head-SHA must match the current PR head,
# and each required field must appear exactly once. A newer OVERRIDE deliberately
# supersedes NEEDS-WORK; older evidence cannot rescue a newer negative or malformed
# marker. The typed authorizer name is a record, not authentication.
# Fable, Opus, and Codex are accepted in the parser's supported signature forms,
# including Codex (gpt-5.6-sol); see CONTRIBUTING.md. New commits stale prior
# markers automatically.
#
# Regression note (PR #291, 2026-08-01): the gate correctly rejected a PASS
# bound to 611ffad after the live PR head had advanced to 955c6b1. Diagnose
# against pulls.get().head.sha and that commit's check runs; evaluating the
# parser with an older SHA can falsely make a stale marker look like a display
# failure. Every later commit still requires a new exact-head verdict.
#
# This repo has enforce_admins OFF (solo repo), so a failing check here
# does not physically block an admin merge — it makes a skipped
# evaluation impossible to miss (a visible red check on the PR) rather
# than impossible to override.

jobs:
  publish-evaluation-status:
    # contains() is case-insensitive, matching the parser. Checking the previous
    # body makes editing away an evaluation marker re-run and fail the gate.
    if: >-
      github.event_name == 'pull_request_target' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        (
          contains(github.event.comment.body, 'Evaluated-by:') ||
          contains(github.event.changes.body.from, 'Evaluated-by:')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      issues: read
      pull-requests: read
    steps:
      - name: check out verdict parser
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: publish independent evaluation status
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { evaluateEvaluationGate } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/evaluation-verdict.cjs`
            );

            const prNumber = context.payload.pull_request?.number ?? context.payload.issue?.number;
            if (!prNumber) {
              core.setFailed("evaluation-gate: could not resolve a PR number from this event.");
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const headSha = pullRequest.head.sha;
            const targetUrl = [
              `https://github.com/${context.repo.owner}/${context.repo.repo}`,
              `actions/runs/${context.runId}`,
            ].join("/");

            const { data: checkRun } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "check-evaluation",
              head_sha: headSha,
              status: "in_progress",
              details_url: targetUrl,
              output: {
                title: "Independent evaluation pending",
                summary: "Checking the evaluator marker for the current PR head.",
              },
            });

            async function complete(conclusion, title, summary) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: checkRun.id,
                status: "completed",
                conclusion,
                completed_at: new Date().toISOString(),
                output: { title, summary },
              });
            }

            try {
              const { data: labels } = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });
              const decision = evaluateEvaluationGate({
                labels,
                comments,
                currentHeadSha: headSha,
              });
              const message = `PR #${prNumber}: ${decision.message}`;

              if (decision.passed) {
                await complete("success", "Independent evaluation accepted", message);
                core.info(message);
                return;
              }

              await complete("failure", "Independent evaluation blocked", message);
              // A rejected verdict is a successfully published gate result. issue_comment
              // jobs run on the default-branch SHA, so failing this Actions-owned publisher
              // leaves a stale native failure on the PR head after a fresh custom check lands.
              core.warning(message);
              return;
            } catch (error) {
              await complete(
                "failure",
                "Evaluation gate error",
                error instanceof Error ? error.message : String(error),
              );
              throw error;
            }
