name: evaluation-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]
  issue_comment:
    types: [created]

# Belt-and-suspenders for the author-never-evaluates-own-code rule
# (performance-od/core/model-routing-card.md). Every PR into main needs
# an independent model review before it merges: the model/tool that wrote
# the code cannot also be the one that grades it. CodeRabbit is a cheap
# first pass, not a substitute for this.
#
# Passes when either is present on the PR:
#   - label "evaluated"
#   - the newest marker comment has the form
#     "Evaluated-by: <Model> — PASS" (also accepts "-- PASS" or "- PASS")
# A newest marker verdict of FAIL, BLOCKED, or NEEDS-WORK keeps the gate red.
# A marker without a recognizable verdict token also keeps the gate red.
#
# This repo has enforce_admins OFF (solo repo), so a failing check here
# does not physically block an admin merge — it makes a skipped
# evaluation impossible to miss (a visible red check on the PR) rather
# than impossible to override.

jobs:
  check-evaluation:
    if: github.event.pull_request != null || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: check out verdict parser
        uses: actions/checkout@v4

      - name: check for an independent evaluation marker
        uses: actions/github-script@v7
        with:
          script: |
            const { evaluateEvaluationGate } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/evaluation-verdict.cjs`
            );

            const prNumber = context.payload.pull_request?.number ?? context.payload.issue?.number;
            if (!prNumber) {
              core.setFailed("evaluation-gate: could not resolve a PR number from this event.");
              return;
            }

            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const decision = evaluateEvaluationGate({ labels, comments });
            const message = `PR #${prNumber}: ${decision.message}`;

            if (decision.passed) {
              core.info(message);
              return;
            }

            core.setFailed(message);
