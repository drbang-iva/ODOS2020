name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI scope: the everyday verification path Devon flagged in odos issue #2.
# DR drill lives in dr-drill.yml (deeper, slower, separate trigger).
# This workflow proves: deps install, types compile, tests pass, UI builds,
# preflight lint clean, and the evaluation gate scripts pass ShellCheck. Nothing more.
#
# Shell: each test/preflight step uses bash with `shopt -s globstar` because
# the mcp/package.json test script relies on `**` glob expansion. The default
# GH Actions shell does not have globstar enabled, and `npm run` invokes via
# sh which never supports globstar. Inlining the test invocation under bash
# with globstar is the least-invasive fix for now.

jobs:
  dependencies:
    name: dependencies — restore or install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      cache_key: ${{ steps.dependency_cache_key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
            ui/package-lock.json
      - name: derive dependency cache key
        id: dependency_cache_key
        run: >-
          echo "key=node-modules-${{ runner.os }}-${{ runner.arch }}-node-22-${{
          hashFiles('package-lock.json', 'mcp/package-lock.json', 'ui/package-lock.json') }}"
          >> "$GITHUB_OUTPUT"
      - name: restore dependency trees
        id: dependency_cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            mcp/node_modules
            ui/node_modules
          key: ${{ steps.dependency_cache_key.outputs.key }}
      - name: install dependency trees on cache miss
        if: steps.dependency_cache.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm --prefix mcp ci
          npm --prefix ui ci
      - name: verify dependency trees
        run: |
          npm ls --all --json >/dev/null
          npm --prefix mcp ls --all --json >/dev/null
          npm --prefix ui ls --all --json >/dev/null

  mcp:
    name: mcp — install + typecheck + tests
    runs-on: ubuntu-latest
    needs: dependencies
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: restore dependency trees
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            mcp/node_modules
            ui/node_modules
          key: ${{ needs.dependencies.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: generate ephemeral Medplum signing keys
        run: npm run generate-medplum-signing-keys
      - name: start Medplum contract backend
        run: >-
          docker compose -p odos-contract-ci -f docker-compose.dr-drill.yml
          up -d postgres redis medplum-server
      - name: wait for Medplum healthcheck
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:18103/healthcheck >/dev/null; then
              docker compose -p odos-contract-ci -f docker-compose.dr-drill.yml ps
              exit 0
            fi
            sleep 2
          done
          docker compose -p odos-contract-ci -f docker-compose.dr-drill.yml logs medplum-server
          exit 1
      - name: install pinned WeasyPrint for real PDF/A contract test
        run: |
          python3 -m venv /tmp/odos-weasyprint
          /tmp/odos-weasyprint/bin/pip install --disable-pip-version-check WeasyPrint==69.0
          echo "/tmp/odos-weasyprint/bin" >> "$GITHUB_PATH"
      - name: typecheck scripts
        run: npm run typecheck:scripts
      - name: typecheck mcp
        working-directory: mcp
        run: npx tsc --noEmit
      - name: run mcp tests
        working-directory: mcp
        shell: bash
        env:
          ODOS_REAL_WEASYPRINT_TEST: "1"
          ODOS_POSTGRES_URL: postgresql://medplum:medplum@127.0.0.1:15432/medplum
        run: |
          shopt -s globstar
          node --import tsx --test --test-concurrency=1 \
            src/__tests__/**/*.test.ts \
            tests/**/*.test.ts \
            ../tests/boundaries/**/*.test.ts \
            ../tests/observation-status-machine/**/*.test.ts \
            ../tests/setup-wizard/**/*.test.ts \
            ../tests/preflight/**/*.test.ts \
            ../tests/smart/**/*.test.ts \
            ../tests/cds/**/*.test.ts \
            ../tests/agentops/**/*.test.ts \
            ../tests/bulk-data/**/*.test.ts \
            ../tests/mandate-8/**/*.test.ts
      # The first integration file bootstraps the project and exports MEDPLUM_PROJECT_ID.
      - name: run credentialed live integration lane
        working-directory: mcp
        env:
          MEDPLUM_BASE_URL: http://localhost:18103/
          MEDPLUM_ADMIN_EMAIL: contract-admin@odos.local
          MEDPLUM_ADMIN_PASSWORD: Odos-contract-CI-Password-1!
          MEDPLUM_CONTRACT_BOOTSTRAP: "1"
        run: npm run test:live-integration
      # CI-ONLY PRIVILEGED SEEDER: the operator ClientApplication stays outside practice-role
      # policies so authorization fixtures can be created without granting those rights to a role.
      - name: create privileged fixture seeder for live authorization lane
        env:
          MEDPLUM_BASE_URL: http://localhost:18103/
          MEDPLUM_ADMIN_EMAIL: contract-admin@odos.local
          MEDPLUM_ADMIN_PASSWORD: Odos-contract-CI-Password-1!
          ODOS_POSTGRES_URL: postgresql://medplum:medplum@127.0.0.1:15432/medplum
        run: |
          for attempt in {1..15}; do
            if output=$(npm run operator-identity -- \
              --project "$MEDPLUM_PROJECT_ID" 2>&1); then
              printf '%s\n' "$output"
              exit 0
            fi
            if ! grep -q "Medplum login failed: 429" <<< "$output"; then
              printf '%s\n' "$output" >&2
              exit 1
            fi
            if (( attempt == 15 )); then
              printf '%s\n' "$output" >&2
              exit 1
            fi
            echo "Medplum login throttled; retrying seeder creation in 5 seconds."
            sleep 5
          done
      # CI-ONLY PRIVILEGED REPAIR: this targets the fresh ephemeral localhost:18103
      # container project. Never point this invocation at a real practice project.
      - name: create canonical practice-role policies for live authorization lane
        env:
          MEDPLUM_BASE_URL: http://localhost:18103/
          MEDPLUM_ADMIN_EMAIL: contract-admin@odos.local
          MEDPLUM_ADMIN_PASSWORD: Odos-contract-CI-Password-1!
          MEDPLUM_CONTRACT_BOOTSTRAP: "1"
          ODOS_POSTGRES_URL: postgresql://medplum:medplum@127.0.0.1:15432/medplum
        run: |
          for attempt in {1..15}; do
            if output=$(npm run repair-practice-roles -- \
              --email "$MEDPLUM_ADMIN_EMAIL" \
              --project "$MEDPLUM_PROJECT_ID" 2>&1); then
              printf '%s\n' "$output"
              exit 0
            fi
            if ! grep -q "Medplum login failed: 429" <<< "$output"; then
              printf '%s\n' "$output" >&2
              exit 1
            fi
            if (( attempt == 15 )); then
              printf '%s\n' "$output" >&2
              exit 1
            fi
            echo "Medplum login throttled; retrying role repair in 5 seconds."
            sleep 5
          done
      # CI-ONLY BREAK-GLASS: --apply is safe only against this fresh ephemeral localhost:18103
      # container project. Never copy this invocation to a real practice project.
      - name: sync canonical practice-role policies for live authorization lane
        env:
          MEDPLUM_BASE_URL: http://localhost:18103/
          MEDPLUM_ADMIN_EMAIL: contract-admin@odos.local
          MEDPLUM_ADMIN_PASSWORD: Odos-contract-CI-Password-1!
        run: >-
          npm run sync-practice-role-policy-rules --
          --project "$MEDPLUM_PROJECT_ID"
          --apply
          --bootstrap-service-identity
      - name: mandate 17 mutation — widen disposable Provider policy
        shell: bash
        env:
          MEDPLUM_BASE_URL: http://localhost:18103/
        run: |
          set -a
          source .odos/operator.env
          set +a
          node --input-type=module <<'NODE'
          const baseUrl = process.env.MEDPLUM_BASE_URL.replace(/\/$/, "");
          const tokenResponse = await fetch(`${baseUrl}/oauth2/token`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({
              grant_type: "client_credentials",
              client_id: process.env.ODOS_OPERATOR_CLIENT_ID,
              client_secret: process.env.ODOS_OPERATOR_CLIENT_SECRET,
            }),
          });
          if (!tokenResponse.ok) throw new Error(`Operator token exchange failed: ${tokenResponse.status}`);
          const { access_token: accessToken } = await tokenResponse.json();
          if (!accessToken) throw new Error("Operator token exchange returned no access token.");
          const headers = {
            Authorization: `Bearer ${accessToken}`,
            "Content-Type": "application/fhir+json",
          };
          const search = await fetch(`${baseUrl}/fhir/R4/AccessPolicy?_count=100`, { headers });
          if (!search.ok) throw new Error(`AccessPolicy search failed: ${search.status}`);
          const bundle = await search.json();
          const policy = bundle.entry?.map((entry) => entry.resource).find((resource) =>
            resource?.meta?.tag?.some((tag) =>
              tag.system === "https://odos2020.com/fhir/NamingSystem/practice-role" && tag.code === "provider"
            )
          );
          if (!policy?.id) throw new Error("Provider AccessPolicy was not found.");
          policy.resource = [
            ...(policy.resource ?? []),
            { resourceType: "AuditEvent", interaction: ["create"] },
          ];
          const update = await fetch(`${baseUrl}/fhir/R4/AccessPolicy/${policy.id}`, {
            method: "PUT",
            headers,
            body: JSON.stringify(policy),
          });
          if (!update.ok) throw new Error(`Provider AccessPolicy widening failed: ${update.status}`);
          NODE
      - name: run credentialed live authorization lane
        # BLOCKING: fixtures use the separate operator seeder created above; every authorization
        # assertion still executes after policy sync through a constrained role or boundary client.
        timeout-minutes: 5
        working-directory: mcp
        shell: bash
        env:
          MEDPLUM_BASE_URL: http://localhost:18103/
          MEDPLUM_ADMIN_EMAIL: contract-admin@odos.local
          MEDPLUM_ADMIN_PASSWORD: Odos-contract-CI-Password-1!
          MEDPLUM_CONTRACT_BOOTSTRAP: "1"
        run: |
          set -a
          source ../.odos/operator.env
          set +a
          npm run test:live-authz
      - name: stop Medplum contract backend
        if: always()
        run: >-
          docker compose -p odos-contract-ci -f docker-compose.dr-drill.yml
          down -v

  ui:
    name: ui — install + typecheck + build
    runs-on: ubuntu-latest
    needs: dependencies
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: restore dependency trees
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            mcp/node_modules
            ui/node_modules
          key: ${{ needs.dependencies.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: typecheck ui
        working-directory: ui
        run: npx tsc --noEmit
      - name: run ui tests
        working-directory: ui
        run: npm test
      - name: build ui
        working-directory: ui
        run: npm run build

  shellcheck:
    name: shellcheck — evaluation gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: lint evaluation gate scripts
        run: >-
          shellcheck
          scripts/eval-worktree.sh
          scripts/eval-post-verdict.sh
          scripts/lib/bot-review-status.sh

  preflight:
    name: preflight — Pass 4 custom lint rules
    runs-on: ubuntu-latest
    needs: dependencies
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: restore dependency trees
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            mcp/node_modules
            ui/node_modules
          key: ${{ needs.dependencies.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: proxy-coverage census self-test
        run: node .claude/skills/tier0-census/scripts/self-test.mjs
      - name: proxy-coverage census (reporting)
        run: node .claude/skills/tier0-census/scripts/check-proxy-coverage.mjs
      - name: run preflight
        run: npm run preflight
