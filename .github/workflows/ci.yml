name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI scope: the everyday verification path Devon flagged in odos issue #2.
# DR drill lives in dr-drill.yml (deeper, slower, separate trigger).
# This workflow proves: deps install, types compile, tests pass, UI builds,
# preflight lint clean, and the evaluation gate scripts pass ShellCheck. Nothing more.
#
# Shell: each test/preflight step uses bash with `shopt -s globstar` because
# the mcp/package.json test script relies on `**` glob expansion. The default
# GH Actions shell does not have globstar enabled, and `npm run` invokes via
# sh which never supports globstar. Inlining the test invocation under bash
# with globstar is the least-invasive fix for now.

jobs:
  mcp:
    name: mcp — install + typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
            ui/package-lock.json
      - name: install root deps
        run: npm ci
      - name: generate ephemeral Medplum signing keys
        run: npm run generate-medplum-signing-keys
      - name: start Medplum contract backend
        run: >-
          docker compose -p odos-contract-ci -f docker-compose.dr-drill.yml
          up -d postgres redis medplum-server
      - name: wait for Medplum healthcheck
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:18103/healthcheck >/dev/null; then
              docker compose -p odos-contract-ci -f docker-compose.dr-drill.yml ps
              exit 0
            fi
            sleep 2
          done
          docker compose -p odos-contract-ci -f docker-compose.dr-drill.yml logs medplum-server
          exit 1
      - name: install mcp deps
        working-directory: mcp
        run: npm ci
      - name: install pinned WeasyPrint for real PDF/A contract test
        run: |
          python3 -m venv /tmp/odos-weasyprint
          /tmp/odos-weasyprint/bin/pip install --disable-pip-version-check WeasyPrint==69.0
          echo "/tmp/odos-weasyprint/bin" >> "$GITHUB_PATH"
      # mcp/tests cross-import ui/src modules (mirror-parity + ui-logic idiom); as of
      # scheduler Phase 2 those ui modules have runtime deps (zustand), so the mcp job
      # needs ui/node_modules too.
      - name: install ui deps
        working-directory: ui
        run: npm ci
      - name: typecheck scripts
        run: npm run typecheck:scripts
      - name: typecheck mcp
        working-directory: mcp
        run: npx tsc --noEmit
      - name: run mcp tests
        working-directory: mcp
        shell: bash
        env:
          ODOS_REAL_WEASYPRINT_TEST: "1"
          ODOS_POSTGRES_URL: postgresql://medplum:medplum@127.0.0.1:15432/medplum
        run: |
          shopt -s globstar
          node --import tsx --test --test-concurrency=1 \
            src/__tests__/**/*.test.ts \
            tests/**/*.test.ts \
            ../tests/boundaries/**/*.test.ts \
            ../tests/observation-status-machine/**/*.test.ts \
            ../tests/setup-wizard/**/*.test.ts \
            ../tests/preflight/**/*.test.ts \
            ../tests/smart/**/*.test.ts \
            ../tests/cds/**/*.test.ts \
            ../tests/agentops/**/*.test.ts \
            ../tests/bulk-data/**/*.test.ts \
            ../tests/mandate-8/**/*.test.ts
      # The contract bootstrap creates the project and exports MEDPLUM_PROJECT_ID for the repair step.
      - name: run Medplum search contract smoke lane
        working-directory: mcp
        env:
          MEDPLUM_BASE_URL: http://localhost:18103/
          MEDPLUM_ADMIN_EMAIL: contract-admin@odos.local
          MEDPLUM_ADMIN_PASSWORD: Odos-contract-CI-Password-1!
          MEDPLUM_CONTRACT_BOOTSTRAP: "1"
        run: |
          node --import tsx --test --test-concurrency=1 tests/searchParamMedplumSmoke.test.ts
          node --import tsx --test --test-concurrency=1 tests/profile-validation.test.ts
      # The bootstrap uses the same local admin identity; reset Medplum's one-minute login throttle before repair.
      - name: wait for ephemeral Medplum login throttle reset
        run: sleep 61
      # CI-ONLY PRIVILEGED REPAIR: this targets the fresh ephemeral localhost:18103
      # container project. Never point this invocation at a real practice project.
      - name: create canonical practice-role policies for live authorization lane
        env:
          MEDPLUM_BASE_URL: http://localhost:18103/
          MEDPLUM_ADMIN_EMAIL: contract-admin@odos.local
          MEDPLUM_ADMIN_PASSWORD: Odos-contract-CI-Password-1!
          MEDPLUM_CONTRACT_BOOTSTRAP: "1"
          ODOS_POSTGRES_URL: postgresql://medplum:medplum@127.0.0.1:15432/medplum
        run: >-
          npm run repair-practice-roles --
          --email "$MEDPLUM_ADMIN_EMAIL"
          --project "$MEDPLUM_PROJECT_ID"
      # CI-ONLY BREAK-GLASS: --apply is safe only against this fresh ephemeral localhost:18103
      # container project. Never copy this invocation to a real practice project.
      - name: sync canonical practice-role policies for live authorization lane
        env:
          MEDPLUM_BASE_URL: http://localhost:18103/
          MEDPLUM_ADMIN_EMAIL: contract-admin@odos.local
          MEDPLUM_ADMIN_PASSWORD: Odos-contract-CI-Password-1!
        run: >-
          npm run sync-practice-role-policy-rules --
          --project "$MEDPLUM_PROJECT_ID"
          --apply
          --bootstrap-service-identity
      - name: enforce preliminary Observation authorization on real Medplum
        working-directory: mcp
        env:
          MEDPLUM_BASE_URL: http://localhost:18103/
          MEDPLUM_ADMIN_EMAIL: contract-admin@odos.local
          MEDPLUM_ADMIN_PASSWORD: Odos-contract-CI-Password-1!
          MEDPLUM_CONTRACT_BOOTSTRAP: "1"
          ODOS_PRELIMINARY_OBSERVATION_AUTHZ_ONLY: "1"
        run: node --import tsx --test --test-concurrency=1 tests/clinicalWriteAuthzLive.test.ts
      # BLOCKING: the encounter Undo ledger is a `Basic` no practice-role policy granted until
      # 2026-09-02, so every clear's ledger write was refused 403 and undo never persisted a slot.
      # No in-memory fake can see that; this lane performs a real clear as Provider and as Staff
      # against the synced policies and asserts the ledger row exists and reads back.
      - name: enforce encounter undo ledger authorization on real Medplum
        working-directory: mcp
        env:
          MEDPLUM_BASE_URL: http://localhost:18103/
          MEDPLUM_ADMIN_EMAIL: contract-admin@odos.local
          MEDPLUM_ADMIN_PASSWORD: Odos-contract-CI-Password-1!
          MEDPLUM_CONTRACT_BOOTSTRAP: "1"
        run: node --import tsx --test --test-concurrency=1 tests/encounterUndoLedgerAuthzLive.test.ts
      - name: run credentialed live authorization lane
        # NON-BLOCKING: the fourth root cause traced on 2026-09-01 is now fixed at source: a denied
        # AuditEvent projection no longer spends a login retry as an unconfirmed distinct principal.
        # The lane's completion (no startup timeout) is currently provided by the throttle-reset
        # wait step from #495, which remains load-bearing — do not remove it on the assumption this
        # fix alone accounts for the lane completing. Independently verified 2026-09-03: this lane
        # already completed with identical pass/fail counts on three main runs before this fix, and
        # the new refusal path never executes inside it, so it supplies no evidence either way here.
        # The preserved seeder/caller identity split must land before its constrained fixture writes
        # can pass.
        # After that, require 10 consecutive green main runs before removing continue-on-error.
        # Keep the bootstrap -> repair -> sync order when burn-in begins.
        continue-on-error: true
        working-directory: mcp
        env:
          MEDPLUM_BASE_URL: http://localhost:18103/
          MEDPLUM_ADMIN_EMAIL: contract-admin@odos.local
          MEDPLUM_ADMIN_PASSWORD: Odos-contract-CI-Password-1!
          MEDPLUM_CONTRACT_BOOTSTRAP: "1"
        run: npm run test:live-authz
      - name: stop Medplum contract backend
        if: always()
        run: >-
          docker compose -p odos-contract-ci -f docker-compose.dr-drill.yml
          down -v

  ui:
    name: ui — install + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            mcp/package-lock.json
            ui/package-lock.json
      - name: install ui deps
        working-directory: ui
        run: npm ci
      # ui/tests cross-import the real MCP history handler for the ocular-health
      # remount contract, so this job needs mcp/node_modules too.
      - name: install mcp deps
        working-directory: mcp
        run: npm ci
      - name: typecheck ui
        working-directory: ui
        run: npx tsc --noEmit
      - name: run ui tests
        working-directory: ui
        run: npm test
      - name: build ui
        working-directory: ui
        run: npm run build

  shellcheck:
    name: shellcheck — evaluation gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: lint evaluation gate scripts
        run: >-
          shellcheck
          scripts/eval-worktree.sh
          scripts/eval-post-verdict.sh
          scripts/lib/bot-review-status.sh

  preflight:
    name: preflight — Pass 4 custom lint rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - name: install deps
        run: |
          npm ci
          cd mcp && npm ci
      - name: run preflight
        run: npm run preflight
